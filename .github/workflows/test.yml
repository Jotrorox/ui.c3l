name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui.c3l
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ui.c3l # project.json resolves the ui library through ".."
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xfonts-base libx11-6 libxtst6
      - name: Set up C3 0.8.4
        uses: Jotrorox/setup-c3@c96f205c661bcdd77d83c6e46dabcc0c17931f98 # v1
        with:
          version: v0.8.4
      - name: C3 tests
        run: c3c test
      - name: Optimized C3 tests
        run: c3c test -O3 --build-dir "$RUNNER_TEMP/ui-release" --output-dir "$RUNNER_TEMP/ui-release"
      - name: Example build
        run: c3c build --path examples/window
      - name: Simulated X11 tests (no desktop)
        run: python3 -m unittest discover -s tests -v
      - name: Native desktop and mapping tests on isolated Xvfb
        run: python3 scripts/test-xvfb.py
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui.c3l
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ui.c3l
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up C3 0.8.4
        uses: Jotrorox/setup-c3@c96f205c661bcdd77d83c6e46dabcc0c17931f98 # v1
        with:
          version: v0.8.4
      - name: C3 tests
        run: c3c test
      - name: Optimized C3 tests
        run: c3c test -O3 --build-dir "$env:RUNNER_TEMP/ui-release" --output-dir "$env:RUNNER_TEMP/ui-release"
      - name: Example build
        run: c3c build --path examples/window
      - name: Native desktop tests when an input desktop is available
        run: python scripts/test-windows.py
