name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: '1'
jobs:
  macos:
    name: macOS (${{ matrix.target }}, ${{ matrix.profile }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [macos-aarch64, macos-x64]
        profile: [debug, release]
        include:
          - profile: debug
            flags: -O0
          - profile: release
            flags: -O3
    defaults:
      run:
        working-directory: ui.c3l
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ui.c3l
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Set up C3 0.8.4 (ARM64)
        run: |
          python3 scripts/install-c3.py --dest "$RUNNER_TEMP/c3-arm64"
          echo "$RUNNER_TEMP/c3-arm64" >> "$GITHUB_PATH"
      - name: Show compiler version and native target
        run: c3c --version
      - name: C3 tests (Intel binaries run under Rosetta)
        run: c3c test --target "${{ matrix.target }}" --linker=cc ${{ matrix.flags }} --build-dir "$RUNNER_TEMP/ui-tests" --output-dir "$RUNNER_TEMP/ui-tests"
      - name: Example build
        run: c3c build --path examples/window --target "${{ matrix.target }}" --linker=cc ${{ matrix.flags }}
  linux:
    name: Linux (${{ matrix.arch }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        profile: [debug, release]
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: linux-aarch64
          - profile: debug
            flags: -O0
          - profile: release
            flags: -O3
    env:
      UI_TEST_TARGET: ${{ matrix.target }}
      UI_TEST_OPTIMIZATION: ${{ matrix.profile }}
    defaults:
      run:
        working-directory: ui.c3l
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ui.c3l # project.json resolves the ui library through ".."
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xfonts-base libx11-6 libxtst6 weston libwayland-client0 libcairo2 libxkbcommon0 xkb-data gdb
      - name: Set up C3 0.8.4 (x64)
        if: matrix.arch == 'x64'
        uses: Jotrorox/setup-c3@c96f205c661bcdd77d83c6e46dabcc0c17931f98 # v1
        with:
          version: v0.8.4
      # C3 0.8.4 has no Linux ARM64 release archive. Build its pinned source natively.
      - name: Cache native ARM64 compiler
        if: matrix.arch == 'arm64'
        id: c3-arm-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/c3-arm64
          key: c3-0.8.4-ubuntu-24.04-arm64-llvm19-${{ hashFiles('ui.c3l/scripts/install-c3.py') }}
      - name: Install compiler build dependencies
        if: matrix.arch == 'arm64' && steps.c3-arm-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y build-essential cmake ninja-build llvm-19-dev liblld-19-dev libpolly-19-dev libcurl4-openssl-dev libzstd-dev
      - name: Build C3 0.8.4 (ARM64)
        if: matrix.arch == 'arm64' && steps.c3-arm-cache.outputs.cache-hit != 'true'
        run: python3 scripts/install-c3.py --dest "$RUNNER_TEMP/c3-arm64"
      - name: Add ARM64 compiler to PATH
        if: matrix.arch == 'arm64'
        run: echo "$RUNNER_TEMP/c3-arm64" >> "$GITHUB_PATH"
      - name: Show compiler version and native target
        run: c3c --version
      - name: C3 tests
        run: |
          c3c test --target "${{ matrix.target }}" ${{ matrix.flags }} --suppress-run --build-dir "$RUNNER_TEMP/ui-tests" --output-dir "$RUNNER_TEMP/ui-tests"
          if [ "${{ matrix.arch }}:${{ matrix.profile }}" = "arm64:release" ]; then
            timeout 120s gdb --batch --return-child-result -ex run -ex 'thread apply all bt' --args "$RUNNER_TEMP/ui-tests/testrun"
          else
            timeout 120s "$RUNNER_TEMP/ui-tests/testrun"
          fi
      - name: Example build
        run: c3c build --path examples/window --target "${{ matrix.target }}" ${{ matrix.flags }}
      - name: Simulated X11 tests (no desktop)
        run: python3 -m unittest discover -s tests -p test_x11.py -v
      - name: Wayland protocol, rendering, input, and selection tests
        run: python3 -m unittest discover -s tests -p test_wayland.py -v
      - name: Native desktop and mapping tests on isolated Xvfb
        run: python3 scripts/test-xvfb.py
      - name: Native Wayland checks on headless Weston
        run: python3 scripts/test-wayland.py
  windows:
    name: Windows (${{ matrix.arch }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        profile: [debug, release]
        include:
          - arch: x64
            runner: windows-2022
            target: windows-x64
          - arch: arm64
            runner: windows-11-arm
            target: windows-aarch64
          - profile: debug
            flags: -O0
          - profile: release
            flags: -O3
    env:
      UI_TEST_TARGET: ${{ matrix.target }}
      UI_TEST_OPTIMIZATION: ${{ matrix.profile }}
    defaults:
      run:
        working-directory: ui.c3l
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ui.c3l
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Set up C3 0.8.4 (x64)
        if: matrix.arch == 'x64'
        uses: Jotrorox/setup-c3@c96f205c661bcdd77d83c6e46dabcc0c17931f98 # v1
        with:
          version: v0.8.4
      - name: Set up C3 0.8.4 (ARM64)
        if: matrix.arch == 'arm64'
        run: |
          python scripts/install-c3.py --dest "$env:RUNNER_TEMP/c3-arm64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/c3-arm64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Show compiler version and native target
        run: c3c --version
      - name: C3 tests
        run: c3c test --target "${{ matrix.target }}" ${{ matrix.flags }} --build-dir "$env:RUNNER_TEMP/ui-tests" --output-dir "$env:RUNNER_TEMP/ui-tests"
      - name: Example build
        run: c3c build --path examples/window --target "${{ matrix.target }}" ${{ matrix.flags }}
      - name: Native desktop tests when an input desktop is available
        run: python scripts/test-windows.py
